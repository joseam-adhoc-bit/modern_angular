<mat-card>
  <mat-card-header>
    <mat-card-title>{{ product_().name }}</mat-card-title>
    <mat-card-subtitle>Category</mat-card-subtitle>
  </mat-card-header>

  <mat-card-content>
    @if (product_().originalPrice){
    <span class="sale-badge">For Sale</span>
    <p class="price-row">
    <span class="current-price">{{product_().price}}</span>
    <span class="original-price">{{product_().originalPrice}}</span>
    </p>
    }
    @else{
      <p class="price-row">
      <span class="current-price">{{product_().price}}</span>
      </p>
    }

    <p>{{ product_().description}}</p>
    <!-- <p class="price">{{ product_().price}}</p> -->
  </mat-card-content>

  <mat-card-actions>
    <button matButton>{{ addButtonLabel()}}</button>
  </mat-card-actions>
</mat-card>
